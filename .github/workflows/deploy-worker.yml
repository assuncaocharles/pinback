name: Deploy auth worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packages/auth-worker/**
      - packages/core/**

concurrency: deploy-worker

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PP_GITHUB_CLIENT_ID: ${{ vars.PP_GITHUB_CLIENT_ID }}
      PP_ALLOWED_ORIGINS: ${{ vars.PP_ALLOWED_ORIGINS }}
      PP_ALLOWED_REPOS: ${{ vars.PP_ALLOWED_REPOS }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$PP_GITHUB_CLIENT_ID" ] || [ -z "$PP_ALLOWED_ORIGINS" ]; then
            echo "::warning::Worker deploy skipped: set CLOUDFLARE_API_TOKEN, PP_GITHUB_CLIENT_ID and PP_ALLOWED_ORIGINS (see docs/setup.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.cfg.outputs.enabled == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.cfg.outputs.enabled == 'true'
      - uses: actions/setup-node@v5
        if: steps.cfg.outputs.enabled == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.cfg.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build frame assets and deploy
        if: steps.cfg.outputs.enabled == 'true'
        working-directory: packages/auth-worker
        run: |
          pnpm exec vite build
          pnpm exec wrangler deploy \
            --var "GITHUB_CLIENT_ID:$PP_GITHUB_CLIENT_ID" \
            --var "ALLOWED_ORIGINS:$PP_ALLOWED_ORIGINS" \
            --var "ALLOWED_REPOS:$PP_ALLOWED_REPOS"
