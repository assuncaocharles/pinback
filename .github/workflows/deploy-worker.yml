name: Deploy auth worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packages/auth-worker/**
      - packages/core/**

concurrency: deploy-worker

permissions:
  contents: read

# Everything is configurable from GitHub settings, so the worker can be
# deployed without a local machine (docs/setup.md):
#   secrets   CLOUDFLARE_API_TOKEN (Workers Scripts: Edit), CLOUDFLARE_ACCOUNT_ID
#             PP_GITHUB_CLIENT_SECRET (optional until the GitHub App exists)
#             PP_SESSION_KEY (optional; a fresh one is generated per deploy if unset)
#   variables PP_GITHUB_CLIENT_ID (optional until the GitHub App exists)
#             PP_ALLOWED_ORIGINS (default: https://*.<CF_PAGES_PROJECT>.pages.dev)
#             PP_ALLOWED_REPOS (default: this repository)

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
      PP_GITHUB_CLIENT_ID: ${{ vars.PP_GITHUB_CLIENT_ID }}
      PP_ALLOWED_ORIGINS: ${{ vars.PP_ALLOWED_ORIGINS || format('https://*.{0}.pages.dev', vars.CF_PAGES_PROJECT || 'preview-pins-demo') }}
      PP_ALLOWED_REPOS: ${{ vars.PP_ALLOWED_REPOS || github.repository }}
      PP_GITHUB_CLIENT_SECRET: ${{ secrets.PP_GITHUB_CLIENT_SECRET }}
      PP_SESSION_KEY: ${{ secrets.PP_SESSION_KEY }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Worker deploy skipped: set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (see docs/setup.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.cfg.outputs.enabled == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.cfg.outputs.enabled == 'true'
      - uses: actions/setup-node@v5
        if: steps.cfg.outputs.enabled == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.cfg.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build frame assets and deploy
        id: deploy
        if: steps.cfg.outputs.enabled == 'true'
        working-directory: packages/auth-worker
        run: |
          set -o pipefail
          pnpm exec vite build
          pnpm exec wrangler deploy \
            --var "GITHUB_CLIENT_ID:$PP_GITHUB_CLIENT_ID" \
            --var "ALLOWED_ORIGINS:$PP_ALLOWED_ORIGINS" \
            --var "ALLOWED_REPOS:$PP_ALLOWED_REPOS" | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::Deploy finished without a workers.dev URL. Register a workers.dev subdomain (Cloudflare → Workers & Pages) or add a route."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Sync secrets
        if: steps.cfg.outputs.enabled == 'true'
        working-directory: packages/auth-worker
        run: |
          # Rotating SESSION_KEY only cancels sign-ins in progress (ADR 7), so a
          # fresh key per deploy is safe when no PP_SESSION_KEY secret is set.
          key="${PP_SESSION_KEY:-$(openssl rand -base64 32)}"
          printf '%s' "$key" | pnpm exec wrangler secret put SESSION_KEY
          if [ -n "$PP_GITHUB_CLIENT_SECRET" ]; then
            printf '%s' "$PP_GITHUB_CLIENT_SECRET" | pnpm exec wrangler secret put GITHUB_CLIENT_SECRET
          else
            echo "::notice::PP_GITHUB_CLIENT_SECRET not set; sign-in stays disabled until it is."
          fi
      - name: Summary
        if: steps.cfg.outputs.enabled == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "### Auth worker deployed"
            echo ""
            echo "- Worker URL: \`$URL\`"
            echo "- GitHub App callback URL: \`$URL/auth/callback\`"
            echo "- Allowed origins: \`$PP_ALLOWED_ORIGINS\`"
            echo "- Client ID set: $([ -n "$PP_GITHUB_CLIENT_ID" ] && echo yes || echo no)"
            echo "- Client secret set: $([ -n "$PP_GITHUB_CLIENT_SECRET" ] && echo yes || echo no)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Auth worker URL::$URL (callback: $URL/auth/callback)"
