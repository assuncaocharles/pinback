name: Release

# Changesets flow (docs/releasing.md):
# - pushes to main with pending changesets open/update a "Version Packages" PR;
# - merging that PR publishes the bumped packages to npm.
# Publishing is opt-in via the NPM_PUBLISH repository variable. It uses npm
# trusted publishing (OIDC, no token) and falls back to the NPM_TOKEN secret
# when one is set (needed once, for the very first publish).

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Trusted publishing needs npm >= 11.5.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - name: Version PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: ${{ vars.NPM_PUBLISH == 'true' && 'pnpm release' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
